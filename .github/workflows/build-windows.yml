name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build_win -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build .exe
        shell: msys2 {0}
        run: cmake --build build_win --config Release

      - name: Package Windows Build
        shell: msys2 {0}
        run: |
          mkdir -p release_win
          cp build_win/PrisonGameMP.exe release_win/
          echo "Покладіть сюди вашу папку assets/ перед запуском!" > release_win/README_ASSETS.txt

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrisonGameMP-Windows-x64
          path: release_win/